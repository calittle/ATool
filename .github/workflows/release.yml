name: Publish release artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and publish
        required: true
        type: string

permissions:
  contents: write

# A tag can be pushed more than once in quick succession.  Keep all attempts
# for that tag in one queue so only one job creates the GitHub Release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish ATool
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build distribution ZIP
        run: python3 tools/build_artifact.py --source head

      - name: Prepare version release notes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          heading = '## ' + os.environ['TAG']
          notes = Path('NOTES.MD').read_text()
          sections = notes.splitlines()
          start = sections.index(heading) + 1
          end = next((index for index in range(start, len(sections)) if sections[index].startswith('## ')), len(sections))
          Path('dist/release-notes.md').write_text('\n'.join(sections[start:end]).strip() + '\n')
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
            gh release edit "$TAG" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" dist/*.zip --title "ATool $TAG" --notes-file dist/release-notes.md
          fi
