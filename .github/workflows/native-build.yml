name: Build native applications

on:
  workflow_call:
    inputs:
      source_ref:
        description: ATool commit or tag to build
        required: true
        type: string
      release_tag:
        description: Published ATool version, including artifact rebuilds
        required: true
        type: string
    secrets:
      MACOS_CERTIFICATE_P12_BASE64:
        required: true
      MACOS_CERTIFICATE_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_TEAM_ID:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  resolve-cli:
    name: Select latest OCCS CLI release
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.cli.outputs.repository }}
      revision: ${{ steps.cli.outputs.revision }}
      tag: ${{ steps.cli.outputs.tag }}
    steps:
      - name: Check out ATool
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Node.js for release selection tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test release selection
        run: node --test tests/test_latest_occs_release.cjs

      - name: Resolve latest published OCCS CLI release
        id: cli
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { latestOccsRelease } = require('./tools/latest_occs_release.cjs');
            const settings = JSON.parse(fs.readFileSync('packaging/runtime-versions.json', 'utf8'));
            const release = await latestOccsRelease(github, settings.occs_repository);
            core.setOutput('repository', release.repository);
            core.setOutput('revision', release.revision);
            core.setOutput('tag', release.tag);
            await core.summary.addHeading('Bundled OCCS CLI release')
              .addLink(release.tag, release.url)
              .addRaw(`\n\nCommit: ${release.revision}\n`).write();

  native:
    name: Build and check ${{ matrix.platform }}
    needs: resolve-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
            bundle: dist/native/ATool.app
          - platform: macos-x86_64
            runner: macos-15-intel
            bundle: dist/native/ATool.app
          - platform: windows-x86_64
            runner: windows-2022
            bundle: dist/native/ATool
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out ATool
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read runtime settings
        id: versions
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          values = json.loads(Path('packaging/runtime-versions.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items():
                  print(f'{key}={value}', file=output)
          PY

      - name: Check out OCCS CLI runtime
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-cli.outputs.repository }}
          ref: ${{ needs.resolve-cli.outputs.revision }}
          path: build/inputs/occs
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node_version }}

      - name: Install application and build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Install locked OCCS CLI dependencies
        working-directory: build/inputs/occs
        run: npm ci --omit=dev

      - name: Locate Node.js and retain its license notices
        id: node
        run: |
          python - <<'PY'
          import os, platform, shutil, subprocess, urllib.request
          from pathlib import Path
          node = Path(shutil.which('node')).resolve()
          version = subprocess.check_output([str(node), '--version'], text=True).strip()
          license_path = Path('build/inputs/Node-LICENSE.txt').resolve()
          with urllib.request.urlopen(f'https://raw.githubusercontent.com/nodejs/node/{version}/LICENSE', timeout=60) as response:
              license_path.write_bytes(response.read())
          notices = {
              'Python-LICENSE.txt': f'https://raw.githubusercontent.com/python/cpython/v{platform.python_version()}/LICENSE',
              'Qt-LGPL-3.0.txt': 'https://raw.githubusercontent.com/qt/qtbase/v6.12.0/LICENSES/LGPL-3.0-only.txt',
          }
          for name, url in notices.items():
              with urllib.request.urlopen(url, timeout=60) as response:
                  (license_path.parent / name).write_bytes(response.read())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'executable={node}', file=output)
              print(f'license={license_path}', file=output)
          PY

      - name: Test native runtime selection and packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p 'test_native_*.py'

      - name: Install Mac signing identity and notarization credentials
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          certificate_path="$RUNNER_TEMP/atool-signing.p12"
          keychain_path="$RUNNER_TEMP/atool-signing.keychain-db"
          keychain_password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$keychain_password"
          python - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = ''.join(os.environ['MACOS_CERTIFICATE_P12_BASE64'].split())
          (Path(os.environ['RUNNER_TEMP']) / 'atool-signing.p12').write_bytes(base64.b64decode(encoded, validate=True))
          PY
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path" >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          keychain = str(Path(os.environ['RUNNER_TEMP']) / 'atool-signing.keychain-db')
          result = subprocess.check_output(['security', 'find-identity', '-v', '-p', 'codesigning', keychain], text=True)
          identities = re.findall(r'\b([A-Fa-f0-9]{40}) "Developer ID Application: [^"\n]+ \(' + re.escape(os.environ['APPLE_TEAM_ID']) + r'\)"', result)
          if len(identities) != 1:
              raise SystemExit('Expected one valid Developer ID Application identity matching APPLE_TEAM_ID in the exported certificate.')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              print('ATOOL_CODESIGN_IDENTITY=' + identities[0], file=output)
              print('PYINSTALLER_STRICT_BUNDLE_CODESIGN_ERROR=1', file=output)
          PY
          xcrun notarytool store-credentials ATool-notary --keychain "$keychain_path" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
          rm -f "$certificate_path"

      - name: Build native application
        env:
          ATOOL_RELEASE_TAG: ${{ inputs.release_tag }}
          NODE_EXECUTABLE: ${{ steps.node.outputs.executable }}
          NODE_LICENSE: ${{ steps.node.outputs.license }}
        run: >-
          python tools/build_native.py --occs-dir build/inputs/occs
          --node "$NODE_EXECUTABLE" --node-license "$NODE_LICENSE"

      - name: Notarize Mac application and staple its ticket
        if: runner.os == 'macOS'
        run: python tools/notarize_macos.py dist/native/ATool.app --keychain "$RUNNER_TEMP/atool-signing.keychain-db"

      - name: Archive tested application
        env:
          BUNDLE: ${{ matrix.bundle }}
          PLATFORM: ${{ matrix.platform }}
        run: python tools/archive_native.py "$BUNDLE" --name "ATool-$PLATFORM"

      - name: Check extracted UI, WebEngine, and OCCS CLI without installed runtimes
        env:
          PLATFORM: ${{ matrix.platform }}
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python tools/check_native_bundle.py "dist/ATool-$PLATFORM.zip"

      - name: Upload native distribution
        uses: actions/upload-artifact@v4
        with:
          name: atool-native-${{ matrix.platform }}
          path: |
            dist/ATool-*.zip
            dist/ATool-*.zip.sha256
          if-no-files-found: error

      - name: Remove temporary Mac signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "$RUNNER_TEMP/atool-signing.p12"
          if [ -f "$RUNNER_TEMP/atool-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/atool-signing.keychain-db"
          fi
